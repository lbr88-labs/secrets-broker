services:
  secrets-broker:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: secrets-broker
    restart: unless-stopped
    ports:
      # Host loopback only. The container still binds 0.0.0.0 so this mapping works.
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/data
    env_file:
      - deploy/.env
    environment:
      - TZ=UTC
